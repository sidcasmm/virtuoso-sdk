name: player_ads
description: Client-side ad insertion for player_core. Google IMA behind Pigeon.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.0-0
  flutter: '>=3.47.0-0'

dependencies:
  flutter:
    sdk: flutter
  player_core:
    path: ../player_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.virtuoso.player.player_ads
        pluginClass: PlayerAdsPlugin
      ios:
        pluginClass: PlayerAdsPlugin
